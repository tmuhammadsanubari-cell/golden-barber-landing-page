# Cegah project Supabase paket gratis di-pause (7 hari tanpa aktivitas; PRD 4.7 langkah 9, D-40).
# Membaca 1 baris tabel publik `branches` dengan anon key (RLS: hanya data publik).
# Secret repo yang dibutuhkan: PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_ANON_KEY.
# Catatan: GitHub menonaktifkan jadwal setelah 60 hari tanpa commit; cek tab Actions sesekali.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 1 * * 1,4' # Senin & Kamis 01.17 UTC (08.17 WIB)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query ringan ke Supabase
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secret PUBLIC_SUPABASE_URL / PUBLIC_SUPABASE_ANON_KEY belum diisi di GitHub."
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/branches?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            cat response.json
            exit 1
          fi
